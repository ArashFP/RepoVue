# Local development database. Port 5433 so it doesn't clash with Grocify's database on 5432.
# Connect with host 127.0.0.1 (not localhost, a WSL relay grabs ::1).
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: repovue
      POSTGRES_USER: repovue
      POSTGRES_PASSWORD: repovue
    ports:
      - "5433:5432"
    volumes:
      - repovue-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repovue -d repovue"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  repovue-db:
